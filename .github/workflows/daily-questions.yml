name: Add daily trivia questions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote one reviewed question per category
        run: node scripts/add-daily-questions.mjs
      - name: Validate question bank
        run: node --test tests/questions.test.mjs
      - name: Commit the daily additions
        run: |
          if git diff --quiet; then
            echo "Question bank is already current."
            exit 0
          fi
          git config user.name "united-trivia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/questions.json app/data/daily-question-queue.json
          git commit -m "Add daily trivia questions"
          git push
